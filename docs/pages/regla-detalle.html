<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COLFLUX — Regla de autollenado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/reglas.css">
  <style>
    .campo { margin-bottom: 14px; }
    .campo label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: 5px; }
    .campo input { border: 1.5px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: .86rem; font-family: inherit; width: 220px; }
    .campo input:focus { border-color: var(--green); outline: none; }

    .caso-seccion { margin-top: 20px; }
    .caso-seccion:first-child { margin-top: 0; }
    .caso-seccion h3 { display: flex; align-items: center; gap: 10px; font-size: .9rem; font-weight: 700; margin-bottom: 8px; }
  </style>
</head>
<body>

<div id="app-nav"></div>

<div class="hero">
  <div class="container">
    <div class="hero-badge">🛠️ Regla de autollenado</div>
    <h1 id="heroTitulo">Cargando…</h1>
    <p id="heroSubtitulo"></p>
  </div>
</div>

<div class="container" id="app">
  <div class="estado-box">Cargando regla…</div>
</div>

<div id="app-footer"></div>

<script src="../assets/js/layout.js"></script>
<script src="../assets/js/role-guard.js"></script>
<script src="../assets/js/reglas-comun.js"></script>
<script src="../config/services.js"></script>
<script>
  const API_BASE = window.COLFLUX_CONFIG.apiBaseUrl;
  const { escapeHtml, conFuenteCarga, cargarDetalleRegla } = ReglasComun;
  const { fuenteId, cargaId } = ReglasComun.leerFuenteCarga();
  const params = new URLSearchParams(window.location.search);
  const codigo = params.get('codigo');

  const state = {
    detalle: null, confirmandoAplicar: false, guardando: false, aplicando: false, mensaje: null,
    confirmandoDeshacer: null, deshaciendo: null,
  };

  function volverUrl() {
    if (!state.detalle) return null;
    const qs = conFuenteCarga({ campo: `${state.detalle.modelo_destino}.${state.detalle.campo_destino}` }, fuenteId, cargaId);
    return `reglas-campo.html?${qs}`;
  }

  function render() {
    const app = document.getElementById('app');
    if (!codigo) {
      app.innerHTML = '<div class="error-box">Falta indicar la regla (parámetro ?codigo= en la URL).</div>';
      return;
    }
    if (!state.detalle) {
      app.innerHTML = '<div class="estado-box">Cargando regla…</div>';
      return;
    }

    const d = state.detalle;
    document.getElementById('heroTitulo').textContent = d.nombre;
    document.getElementById('heroSubtitulo').textContent = `${d.modelo_destino}.${d.campo_destino}`;

    const campos = d.parametros_schema.map(p => `
      <div class="campo">
        <label for="param_${p.clave}">${escapeHtml(p.etiqueta)}</label>
        <input id="param_${p.clave}" type="${p.tipo === 'time' ? 'time' : 'number'}"
               value="${escapeHtml(d.parametros[p.clave])}" data-clave="${p.clave}">
      </div>
    `).join('');

    function contextoLegible(contexto) {
      const { caso, ...resto } = contexto;
      return Object.entries(resto).map(([k, v]) => `${k}: ${v ?? '—'}`).join(' · ');
    }

    function validacionUrl() {
      return `regla-validacion.html?${conFuenteCarga({ codigo }, fuenteId, cargaId)}`;
    }

    const casosSecciones = (d.casos || []).map(caso => `
      <div class="caso-seccion">
        <h3>${escapeHtml(caso.etiqueta)} <span class="pendientes-badge">${caso.cantidad}</span></h3>
        <table class="ejemplo-tabla">
          <thead><tr><th>Registro</th><th>Contexto</th><th>Valor propuesto</th></tr></thead>
          <tbody>
            ${caso.ejemplo.map(e => `
              <tr>
                <td>#${e.objeto_id}</td>
                <td>${escapeHtml(contextoLegible(e.contexto))}</td>
                <td><strong>${escapeHtml(e.valor_nuevo)}</strong></td>
              </tr>
            `).join('') || '<tr><td colspan="3">Sin ejemplos.</td></tr>'}
          </tbody>
        </table>
        ${caso.cantidad > caso.ejemplo.length ? `<p class="descripcion">Mostrando ${caso.ejemplo.length} de ${caso.cantidad} de este caso.</p>` : ''}
      </div>
    `).join('');

    const volver = volverUrl();

    app.innerHTML = `
      ${state.mensaje ? `<div class="${state.mensaje.ok ? 'ok-box' : 'error-box'}">${escapeHtml(state.mensaje.texto)}</div>` : ''}

      <div class="card">
        <h2>Qué hace esta regla</h2>
        <p class="descripcion">${escapeHtml(d.descripcion)}</p>
      </div>

      <div class="card">
        <h2>Parámetros de cálculo</h2>
        ${campos}
        <button type="button" class="btn-primary" id="btnGuardar" ${state.guardando ? 'disabled' : ''}>
          ${state.guardando ? 'Guardando…' : 'Guardar parámetros'}
        </button>
      </div>

      <div class="card">
        <h2>Ejemplo con los parámetros actuales, por caso</h2>
        <p class="descripcion">Los ${d.pendientes} registros pendientes se agrupan según qué condición de la regla les aplica.</p>
        ${casosSecciones || '<p class="descripcion">No hay pendientes.</p>'}
      </div>

      <div class="card">
        <h2>Validación de valores — hora de la toma</h2>
        <p class="descripcion">Explora el rango y la distribución por hora del día de <code>SubmuestraGEI.hora</code>, agrupado por condición de luz, con gráficas para detectar tomas mal clasificadas.</p>
        <a class="btn-secondary" href="${validacionUrl()}">📊 Ver validación de rangos →</a>
      </div>

      <div class="card">
        <h2>Aplicar</h2>
        <p class="descripcion" style="margin-bottom:12px;">
          <span class="pendientes-badge">${d.pendientes} pendientes en toda la base de datos</span>
        </p>
        ${!d.pendientes ? '' : state.confirmandoAplicar ? `
          <p style="margin-bottom:10px; font-weight:600; color:#92400e;">¿Confirmas aplicar esta regla a los ${d.pendientes} registros pendientes? Esta acción escribe directamente en la base de datos.</p>
          <button type="button" class="btn-warn" id="btnConfirmarAplicar" ${state.aplicando ? 'disabled' : ''}>
            ${state.aplicando ? 'Aplicando…' : `Sí, aplicar a ${d.pendientes}`}
          </button>
          <button type="button" class="btn-secondary" id="btnCancelarAplicar" ${state.aplicando ? 'disabled' : ''}>Cancelar</button>
        ` : `
          <button type="button" class="btn-warn" id="btnAplicar">Aplicar a los ${d.pendientes} pendientes</button>
        `}
      </div>

      <div class="card">
        <h2>Historial de aplicaciones</h2>
        ${d.historial.length ? `
          <table class="ejemplo-tabla">
            <thead><tr><th>Fecha</th><th>Registros</th><th>Estado</th><th></th></tr></thead>
            <tbody>
              ${d.historial.map(h => `
                <tr>
                  <td>${new Date(h.fecha).toLocaleString('es-CO')}</td>
                  <td>${h.cantidad}</td>
                  <td>${h.deshecho ? `Deshecho (${new Date(h.deshecha_en).toLocaleString('es-CO')})` : 'Aplicado'}</td>
                  <td>
                    ${h.deshecho ? '' : state.confirmandoDeshacer === h.lote ? `
                      <button type="button" class="btn-warn" style="padding:4px 10px; font-size:.76rem;"
                        data-confirmar-deshacer="${h.lote}" ${state.deshaciendo ? 'disabled' : ''}>
                        ${state.deshaciendo === h.lote ? 'Deshaciendo…' : 'Sí, deshacer'}
                      </button>
                      <button type="button" class="btn-secondary" style="padding:4px 10px; font-size:.76rem;"
                        data-cancelar-deshacer="1">Cancelar</button>
                    ` : `
                      <button type="button" class="btn-secondary" style="padding:4px 10px; font-size:.76rem;"
                        data-deshacer="${h.lote}">↩ Deshacer</button>
                    `}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        ` : '<p class="descripcion">Todavía no se ha aplicado esta regla.</p>'}
      </div>

      ${volver ? `<a class="btn-secondary" href="${volver}">← Volver a las reglas del atributo</a>` : ''}
    `;

    document.getElementById('btnGuardar')?.addEventListener('click', guardarParametros);
    document.getElementById('btnAplicar')?.addEventListener('click', () => {
      state.confirmandoAplicar = true;
      render();
    });
    document.getElementById('btnCancelarAplicar')?.addEventListener('click', () => {
      state.confirmandoAplicar = false;
      render();
    });
    document.getElementById('btnConfirmarAplicar')?.addEventListener('click', aplicarRegla);

    app.querySelectorAll('[data-deshacer]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.confirmandoDeshacer = btn.dataset.deshacer;
        render();
      });
    });
    app.querySelectorAll('[data-cancelar-deshacer]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.confirmandoDeshacer = null;
        render();
      });
    });
    app.querySelectorAll('[data-confirmar-deshacer]').forEach(btn => {
      btn.addEventListener('click', () => deshacerLote(btn.dataset.confirmarDeshacer));
    });
  }

  async function cargarDetalle() {
    try {
      state.detalle = await cargarDetalleRegla(API_BASE, codigo);
    } catch (e) {
      state.mensaje = { ok: false, texto: `Error al cargar la regla: ${e.message}` };
    }
    render();
  }

  async function guardarParametros() {
    const app = document.getElementById('app');
    const parametros = {};
    app.querySelectorAll('[data-clave]').forEach(input => {
      parametros[input.dataset.clave] = input.value;
    });

    state.guardando = true;
    render();
    try {
      await ReglasComun.fetchJson(`${API_BASE}/api/reglas-autollenado/${encodeURIComponent(codigo)}/parametros/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ parametros }),
      });
      state.mensaje = { ok: true, texto: 'Parámetros guardados. El ejemplo se recalculó con los nuevos valores.' };
      await cargarDetalle();
    } catch (e) {
      state.mensaje = { ok: false, texto: `Error al guardar: ${e.message}` };
    } finally {
      state.guardando = false;
      render();
    }
  }

  async function aplicarRegla() {
    state.aplicando = true;
    render();
    try {
      const data = await ReglasComun.fetchJson(`${API_BASE}/api/reglas-autollenado/${encodeURIComponent(codigo)}/aplicar/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}),
      });
      state.mensaje = { ok: true, texto: `Se aplicó la regla a ${data.aplicados} registros.` };
      state.confirmandoAplicar = false;
      await cargarDetalle();
    } catch (e) {
      state.mensaje = { ok: false, texto: `Error al aplicar la regla: ${e.message}` };
    } finally {
      state.aplicando = false;
      render();
    }
  }

  async function deshacerLote(lote) {
    state.confirmandoDeshacer = null;
    state.deshaciendo = lote;
    render();
    try {
      const data = await ReglasComun.fetchJson(`${API_BASE}/api/reglas-autollenado/lotes/${encodeURIComponent(lote)}/deshacer/`, {
        method: 'POST',
      });
      state.mensaje = { ok: true, texto: `Se deshicieron ${data.deshechas} registros de ese lote.` };
      await cargarDetalle();
    } catch (e) {
      state.mensaje = { ok: false, texto: `Error al deshacer: ${e.message}` };
    } finally {
      state.deshaciendo = null;
      render();
    }
  }

  cargarDetalle();
</script>
</body>
</html>
