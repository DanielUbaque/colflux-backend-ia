<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COLFLUX — Regla de autollenado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; color: #1a2236; background: #f8fafc; line-height: 1.6; }

    :root {
      --green:   #18735d; --green-l: #e6f4f0; --green-d: #0d4f40;
      --amber:   #d97706; --amber-l: #fef3c7;
      --red:     #dc2626; --red-l:   #fee2e2;
      --gray:    #64748b; --gray-l:  #f1f5f9;
      --border:  #e2e8f0;
    }

    .container { max-width: 900px; margin: 0 auto; padding: 0 24px; }

    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,.96); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border); padding: 12px 0;
    }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; max-width: 1400px; margin: 0 auto; padding: 0 24px; }
    .nav-logo { font-weight: 800; font-size: 1rem; color: var(--green-d); text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .nav-links { display: flex; gap: 24px; list-style: none; }
    .nav-links a { color: var(--gray); font-size: .85rem; font-weight: 500; text-decoration: none; transition: color .2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--green); font-weight: 700; }
    .nav-pill { background: var(--green-d); color: white; font-size: .75rem; font-weight: 700; padding: 5px 12px; border-radius: 20px; text-decoration: none; }
    @media (max-width: 600px) { .nav-links { display: none; } }

    .hero { background: #0d4f40; color: white; padding: 40px 0 28px; }
    .hero-badge { display: inline-flex; align-items: center; gap: 7px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); border-radius: 20px; padding: 4px 14px; font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 14px; }
    .hero h1 { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 800; margin-bottom: 6px; }
    .hero p { font-size: .88rem; color: rgba(255,255,255,.8); }

    .card { background: white; border: 1.5px solid var(--border); border-radius: 12px; padding: 24px; margin: 24px 0; }
    .card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
    .card p.descripcion { font-size: .88rem; color: var(--gray); margin-bottom: 4px; }

    .campo { margin-bottom: 14px; }
    .campo label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: 5px; }
    .campo input { border: 1.5px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: .86rem; font-family: inherit; width: 220px; }
    .campo input:focus { border-color: var(--green); outline: none; }

    .btn-secondary { background: white; color: var(--gray); border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 16px; font-size: .84rem; font-weight: 600; font-family: inherit; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn-secondary:hover { border-color: var(--gray); color: #1a2236; }
    .btn-secondary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--green-d); color: white; border: none; border-radius: 8px; padding: 8px 16px; font-size: .84rem; font-weight: 700; font-family: inherit; cursor: pointer; }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
    .btn-warn { background: var(--amber); color: white; border: none; border-radius: 8px; padding: 8px 16px; font-size: .84rem; font-weight: 700; font-family: inherit; cursor: pointer; }

    .ejemplo-tabla { width: 100%; border-collapse: collapse; font-size: .8rem; margin-top: 10px; }
    .ejemplo-tabla th, .ejemplo-tabla td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    .ejemplo-tabla th { color: var(--gray); font-weight: 700; font-size: .72rem; text-transform: uppercase; }

    .estado-box { padding: 40px 0; text-align: center; color: var(--gray); font-size: .9rem; }
    .error-box { background: var(--red-l); color: var(--red); border-radius: 10px; padding: 14px 18px; font-size: .85rem; margin: 16px 0; }
    .ok-box { background: var(--green-l); color: var(--green-d); border-radius: 10px; padding: 14px 18px; font-size: .85rem; margin: 16px 0; }

    .pendientes-badge { display: inline-block; background: var(--amber-l); color: #92400e; border-radius: 20px; padding: 4px 12px; font-size: .8rem; font-weight: 700; }

    footer { background: #0d1117; color: rgba(255,255,255,.5); padding: 28px 0; font-size: .82rem; margin-top: 40px; }
  </style>
</head>
<body>

<div id="app-nav"></div>

<div class="hero">
  <div class="container">
    <div class="hero-badge">🛠️ Regla de autollenado</div>
    <h1 id="heroTitulo">Cargando…</h1>
    <p id="heroSubtitulo"></p>
  </div>
</div>

<div class="container" id="app">
  <div class="estado-box">Cargando regla…</div>
</div>

<div id="app-footer"></div>

<script src="../assets/js/layout.js"></script>
<script src="../assets/js/role-guard.js"></script>
<script src="../config/services.js"></script>
<script>
  const API_BASE = window.COLFLUX_CONFIG.apiBaseUrl;
  const params = new URLSearchParams(window.location.search);
  const codigo = params.get('codigo');
  const fuenteId = params.get('fuente');
  const cargaId = params.get('carga');

  const state = {
    detalle: null, confirmandoAplicar: false, guardando: false, aplicando: false, mensaje: null,
    confirmandoDeshacer: null, deshaciendo: null,
  };

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function volverUrl() {
    if (!fuenteId || !cargaId) return null;
    const qs = new URLSearchParams({ fuente: fuenteId, carga: cargaId });
    return `etl-datos.html?${qs}`;
  }

  function render() {
    const app = document.getElementById('app');
    if (!codigo) {
      app.innerHTML = '<div class="error-box">Falta indicar la regla (parámetro ?codigo= en la URL).</div>';
      return;
    }
    if (!state.detalle) {
      app.innerHTML = '<div class="estado-box">Cargando regla…</div>';
      return;
    }

    const d = state.detalle;
    document.getElementById('heroTitulo').textContent = d.nombre;
    document.getElementById('heroSubtitulo').textContent = `${d.modelo_destino}.${d.campo_destino}`;

    const campos = d.parametros_schema.map(p => `
      <div class="campo">
        <label for="param_${p.clave}">${escapeHtml(p.etiqueta)}</label>
        <input id="param_${p.clave}" type="${p.tipo === 'time' ? 'time' : 'number'}"
               value="${escapeHtml(d.parametros[p.clave])}" data-clave="${p.clave}">
      </div>
    `).join('');

    const ejemploFilas = d.ejemplo.map(e => `
      <tr>
        <td>#${e.objeto_id}</td>
        <td>${escapeHtml(JSON.stringify(e.contexto))}</td>
        <td><strong>${escapeHtml(e.valor_nuevo)}</strong></td>
      </tr>
    `).join('');

    const volver = volverUrl();

    app.innerHTML = `
      ${state.mensaje ? `<div class="${state.mensaje.ok ? 'ok-box' : 'error-box'}">${escapeHtml(state.mensaje.texto)}</div>` : ''}

      <div class="card">
        <h2>Qué hace esta regla</h2>
        <p class="descripcion">${escapeHtml(d.descripcion)}</p>
      </div>

      <div class="card">
        <h2>Parámetros de cálculo</h2>
        ${campos}
        <button type="button" class="btn-primary" id="btnGuardar" ${state.guardando ? 'disabled' : ''}>
          ${state.guardando ? 'Guardando…' : 'Guardar parámetros'}
        </button>
      </div>

      <div class="card">
        <h2>Ejemplo con los parámetros actuales</h2>
        <p class="descripcion">Vista previa de los primeros ${d.ejemplo.length} de ${d.pendientes} registros pendientes.</p>
        <table class="ejemplo-tabla">
          <thead><tr><th>Registro</th><th>Contexto</th><th>Valor propuesto</th></tr></thead>
          <tbody>${ejemploFilas || '<tr><td colspan="3">No hay pendientes.</td></tr>'}</tbody>
        </table>
      </div>

      <div class="card">
        <h2>Aplicar</h2>
        <p class="descripcion" style="margin-bottom:12px;">
          <span class="pendientes-badge">${d.pendientes} pendientes en toda la base de datos</span>
        </p>
        ${!d.pendientes ? '' : state.confirmandoAplicar ? `
          <p style="margin-bottom:10px; font-weight:600; color:#92400e;">¿Confirmas aplicar esta regla a los ${d.pendientes} registros pendientes? Esta acción escribe directamente en la base de datos.</p>
          <button type="button" class="btn-warn" id="btnConfirmarAplicar" ${state.aplicando ? 'disabled' : ''}>
            ${state.aplicando ? 'Aplicando…' : `Sí, aplicar a ${d.pendientes}`}
          </button>
          <button type="button" class="btn-secondary" id="btnCancelarAplicar" ${state.aplicando ? 'disabled' : ''}>Cancelar</button>
        ` : `
          <button type="button" class="btn-warn" id="btnAplicar">Aplicar a los ${d.pendientes} pendientes</button>
        `}
      </div>

      <div class="card">
        <h2>Historial de aplicaciones</h2>
        ${d.historial.length ? `
          <table class="ejemplo-tabla">
            <thead><tr><th>Fecha</th><th>Registros</th><th>Estado</th><th></th></tr></thead>
            <tbody>
              ${d.historial.map(h => `
                <tr>
                  <td>${new Date(h.fecha).toLocaleString('es-CO')}</td>
                  <td>${h.cantidad}</td>
                  <td>${h.deshecho ? `Deshecho (${new Date(h.deshecha_en).toLocaleString('es-CO')})` : 'Aplicado'}</td>
                  <td>
                    ${h.deshecho ? '' : state.confirmandoDeshacer === h.lote ? `
                      <button type="button" class="btn-warn" style="padding:4px 10px; font-size:.76rem;"
                        data-confirmar-deshacer="${h.lote}" ${state.deshaciendo ? 'disabled' : ''}>
                        ${state.deshaciendo === h.lote ? 'Deshaciendo…' : 'Sí, deshacer'}
                      </button>
                      <button type="button" class="btn-secondary" style="padding:4px 10px; font-size:.76rem;"
                        data-cancelar-deshacer="1">Cancelar</button>
                    ` : `
                      <button type="button" class="btn-secondary" style="padding:4px 10px; font-size:.76rem;"
                        data-deshacer="${h.lote}">↩ Deshacer</button>
                    `}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        ` : '<p class="descripcion">Todavía no se ha aplicado esta regla.</p>'}
      </div>

      ${volver ? `<a class="btn-secondary" href="${volver}">← Volver a los datos de la carga</a>` : ''}
    `;

    document.getElementById('btnGuardar')?.addEventListener('click', guardarParametros);
    document.getElementById('btnAplicar')?.addEventListener('click', () => {
      state.confirmandoAplicar = true;
      render();
    });
    document.getElementById('btnCancelarAplicar')?.addEventListener('click', () => {
      state.confirmandoAplicar = false;
      render();
    });
    document.getElementById('btnConfirmarAplicar')?.addEventListener('click', aplicarRegla);

    app.querySelectorAll('[data-deshacer]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.confirmandoDeshacer = btn.dataset.deshacer;
        render();
      });
    });
    app.querySelectorAll('[data-cancelar-deshacer]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.confirmandoDeshacer = null;
        render();
      });
    });
    app.querySelectorAll('[data-confirmar-deshacer]').forEach(btn => {
      btn.addEventListener('click', () => deshacerLote(btn.dataset.confirmarDeshacer));
    });
  }

  async function cargarDetalle() {
    try {
      const res = await fetch(`${API_BASE}/api/reglas-autollenado/${encodeURIComponent(codigo)}/`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      state.detalle = data;
    } catch (e) {
      state.mensaje = { ok: false, texto: `Error al cargar la regla: ${e.message}` };
    }
    render();
  }

  async function guardarParametros() {
    const app = document.getElementById('app');
    const parametros = {};
    app.querySelectorAll('[data-clave]').forEach(input => {
      parametros[input.dataset.clave] = input.value;
    });

    state.guardando = true;
    render();
    try {
      const res = await fetch(`${API_BASE}/api/reglas-autollenado/${encodeURIComponent(codigo)}/parametros/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ parametros }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      state.mensaje = { ok: true, texto: 'Parámetros guardados. El ejemplo se recalculó con los nuevos valores.' };
      await cargarDetalle();
    } catch (e) {
      state.mensaje = { ok: false, texto: `Error al guardar: ${e.message}` };
    } finally {
      state.guardando = false;
      render();
    }
  }

  async function aplicarRegla() {
    state.aplicando = true;
    render();
    try {
      const res = await fetch(`${API_BASE}/api/reglas-autollenado/${encodeURIComponent(codigo)}/aplicar/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      state.mensaje = { ok: true, texto: `Se aplicó la regla a ${data.aplicados} registros.` };
      state.confirmandoAplicar = false;
      await cargarDetalle();
    } catch (e) {
      state.mensaje = { ok: false, texto: `Error al aplicar la regla: ${e.message}` };
    } finally {
      state.aplicando = false;
      render();
    }
  }

  async function deshacerLote(lote) {
    state.confirmandoDeshacer = null;
    state.deshaciendo = lote;
    render();
    try {
      const res = await fetch(`${API_BASE}/api/reglas-autollenado/lotes/${encodeURIComponent(lote)}/deshacer/`, {
        method: 'POST',
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      state.mensaje = { ok: true, texto: `Se deshicieron ${data.deshechas} registros de ese lote.` };
      await cargarDetalle();
    } catch (e) {
      state.mensaje = { ok: false, texto: `Error al deshacer: ${e.message}` };
    } finally {
      state.deshaciendo = null;
      render();
    }
  }

  cargarDetalle();
</script>
</body>
</html>
