<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COLFLUX — Reglas del atributo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/reglas.css">
  <style>
    .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; margin: 24px 0; }
    .tarjeta {
      background: white; border: 1.5px solid var(--border); border-radius: 12px; padding: 22px;
      text-decoration: none; color: inherit; display: block; transition: border-color .15s, box-shadow .15s;
    }
    .tarjeta:hover { border-color: var(--green); box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .tarjeta .icono { font-size: 1.6rem; margin-bottom: 8px; }
    .tarjeta h3 { font-size: .95rem; font-weight: 700; margin-bottom: 6px; }
    .tarjeta p { font-size: .82rem; color: var(--gray); margin-bottom: 10px; }
    .tarjeta .pendientes-badge { display: inline-block; background: var(--amber-l); color: #92400e; border-radius: 20px; padding: 3px 10px; font-size: .76rem; font-weight: 700; }
    .tarjeta .ir { font-size: .8rem; font-weight: 700; color: var(--green); }
  </style>
</head>
<body>

<div id="app-nav"></div>

<div class="hero">
  <div class="container">
    <div class="hero-badge">🧭 Reglas del atributo</div>
    <h1 id="heroTitulo">Cargando…</h1>
    <p id="heroSubtitulo"></p>
  </div>
</div>

<div class="container" id="app">
  <div class="estado-box">Cargando reglas…</div>
</div>

<div id="app-footer"></div>

<script src="../assets/js/layout.js"></script>
<script src="../assets/js/role-guard.js"></script>
<script src="../assets/js/reglas-comun.js"></script>
<script src="../config/services.js"></script>
<script>
  const API_BASE = window.COLFLUX_CONFIG.apiBaseUrl;
  const { escapeHtml, conFuenteCarga } = ReglasComun;
  const { fuenteId, cargaId } = ReglasComun.leerFuenteCarga();
  const params = new URLSearchParams(window.location.search);
  const campo = params.get('campo');

  const state = { reglas: null, mensaje: null };

  function qsPara(extra) {
    return conFuenteCarga(extra, fuenteId, cargaId);
  }

  function volverUrl() {
    if (!fuenteId || !cargaId) return null;
    const qs = new URLSearchParams({ fuente: fuenteId, carga: cargaId });
    return `etl-datos.html?${qs}`;
  }

  function render() {
    const app = document.getElementById('app');
    if (!campo) {
      app.innerHTML = '<div class="error-box">Falta indicar el atributo (parámetro ?campo= en la URL, formato Modelo.campo).</div>';
      return;
    }
    if (!state.reglas) {
      app.innerHTML = state.mensaje
        ? `<div class="error-box">${escapeHtml(state.mensaje.texto)}</div>`
        : '<div class="estado-box">Cargando reglas…</div>';
      return;
    }

    document.getElementById('heroTitulo').textContent = campo;
    document.getElementById('heroSubtitulo').textContent = 'Reglas de autollenado y validación disponibles para este atributo.';

    if (!state.reglas.length) {
      app.innerHTML = '<div class="estado-box">No hay reglas configuradas para este atributo.</div>';
      return;
    }

    const tarjetas = state.reglas.flatMap(r => {
      const cards = [];
      cards.push(`
        <a class="tarjeta" href="regla-detalle.html?${qsPara({ codigo: r.codigo })}">
          <div class="icono">🛠️</div>
          <h3>${escapeHtml(r.nombre)}</h3>
          <p>${escapeHtml(r.descripcion)}</p>
          ${r.pendientes ? `<span class="pendientes-badge">${r.pendientes} pendientes</span>` : ''}
          <div class="ir" style="margin-top:10px;">Ver regla de autollenado →</div>
        </a>
      `);
      if (r.tiene_validacion) {
        cards.push(`
          <a class="tarjeta" href="regla-validacion.html?${qsPara({ codigo: r.codigo })}">
            <div class="icono">📊</div>
            <h3>Validación de rangos</h3>
            <p>Explora el rango y la distribución de los valores ya asignados en <code>${escapeHtml(campo)}</code>, con gráficas para detectar datos mal asignados.</p>
            <div class="ir">Ver validación de rangos →</div>
          </a>
        `);
      }
      return cards;
    });

    const volver = volverUrl();

    app.innerHTML = `
      <div class="tarjetas">${tarjetas.join('')}</div>
      ${volver ? `<a class="btn-secondary" href="${volver}">← Volver a los datos de la carga</a>` : ''}
    `;
  }

  async function cargarReglas() {
    try {
      const data = await ReglasComun.listarReglas(API_BASE);
      state.reglas = (data.reglas || []).filter(r => `${r.modelo_destino}.${r.campo_destino}` === campo);
    } catch (e) {
      state.mensaje = { ok: false, texto: `Error al cargar las reglas: ${e.message}` };
    }
    render();
  }

  cargarReglas();
</script>
</body>
</html>
